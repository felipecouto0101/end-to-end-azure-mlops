name: Validate Azure ML Connection

on:
  workflow_dispatch:  # somente manual — não dispara em push

jobs:
  validate:
    name: Test Azure ML Authentication
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install azure-ai-ml azure-identity

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Azure ML config.json
        run: |
          cat <<EOF > config.json
          {
            "subscription_id": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "resource_group": "${{ secrets.AZURE_RESOURCE_GROUP }}",
            "workspace_name": "${{ secrets.AZURE_ML_WORKSPACE }}"
          }
          EOF

      - name: Validate connection to Azure ML Workspace
        run: |
          python - <<EOF
          from azure.ai.ml import MLClient
          from azure.identity import DefaultAzureCredential

          ml_client = MLClient.from_config(credential=DefaultAzureCredential())

          print("=== Conexao com Azure ML validada com sucesso! ===")
          print(f"Workspace  : {ml_client.workspace_name}")
          print(f"Resource Group: {ml_client.resource_group_name}")
          print(f"Subscription  : {ml_client.subscription_id}")

          # Lista os computes disponiveis
          computes = list(ml_client.compute.list())
          print(f"\nClusters encontrados ({len(computes)}):")
          for c in computes:
              print(f"  - {c.name} [{c.type}]")
          EOF
