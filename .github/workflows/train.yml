name: Train and Register Model

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "azureml/**"
      - "tests/**"
      - "requirements-dev.txt"
    tags:
      - "v*"        # ex: v1.0.0 — dispara testes + treinamento no Azure ML
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "azureml/**"
      - "tests/**"
      - "requirements-dev.txt"
  workflow_dispatch:

jobs:
  # ── Job 1: Testes — roda em TODOS os eventos ──────────────────────────────────
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests (pytest)
        run: pytest tests/test_train.py -v --tb=short

      - name: Run data quality tests (Great Expectations)
        run: pytest tests/test_data_quality.py -v --tb=short

  # ── Job 2: Treinamento — só roda quando é uma tag v* ─────────────────────────
  train:
    name: Submit Training Job to Azure ML
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')  # ignora pushs normais de branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install azure-ai-ml azure-identity mlflow azureml-mlflow

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Azure ML config.json
        run: |
          cat <<EOF > config.json
          {
            "subscription_id": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "resource_group": "${{ secrets.AZURE_RESOURCE_GROUP }}",
            "workspace_name": "${{ secrets.AZURE_ML_WORKSPACE }}"
          }
          EOF

      - name: Submit training job and register model
        run: python azureml/run_pipeline.py
        env:
          MODEL_VERSION_TAG: ${{ github.ref_name }}  # ex: v1.0.0
