name: Train and Register Model

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "azureml/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "azureml/**"

jobs:
  train:
    name: Submit Training Job to Azure ML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install azure-ai-ml azure-identity mlflow azureml-mlflow

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Azure ML config.json
        run: |
          mkdir -p .azureml
          cat <<EOF > config.json
          {
            "subscription_id": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "resource_group": "${{ secrets.AZURE_RESOURCE_GROUP }}",
            "workspace_name": "${{ secrets.AZURE_ML_WORKSPACE }}"
          }
          EOF

      - name: Submit training job and register model
        run: python azureml/run_pipeline.py
